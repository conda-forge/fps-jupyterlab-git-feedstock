schema_version: 1

context:
  version: "0.3.1"

package:
  name: fps-jupyterlab-git
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-jupyterlab-git/fps_jupyterlab_git-${{ version }}.tar.gz
    sha256: 0257e191fe6298496ae3fd103dd92eaf7817e912ef655acae7808748fddb5ea0

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - fps
    - jupyverse-api
    - jupyverse-contents >=0.1.3
    - jupyterlab-git-core >=0.53.0,<0.54.0

tests:
  - python:
      imports: fps_jupyterlab_git
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/jupyterlab_git
  summary: An FPS plugin for jupyterlab-git

extra:
  recipe-maintainers:
    - davidbrochart
